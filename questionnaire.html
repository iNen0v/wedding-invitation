<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Въпросник за присъствие</title>
    <link rel="stylesheet" href="questionnaire.css">
</head>
<body>
    <div class="container">
        <h1>Въпросник за присъствие на сватбата</h1>
        
        <form id="wedding-form">
            <!-- Въпрос 1 -->
            <div class="question">
                <h3>Ще присъствате ли на нашата сватба?</h3>
                <label>
                    <input type="radio" name="attendance" value="yes" required>
                    Да
                </label>
                <label>
                    <input type="radio" name="attendance" value="no">
                    Не
                </label>
            </div>

            <!-- Въпрос 2 -->
            <div class="question">
                <h3>Ще бъдете ли с придружител?</h3>
                <label>
                    <input type="radio" name="companion" value="yes">
                    Да
                </label>
                <label>
                    <input type="radio" name="companion" value="no">
                    Не
                </label>
            </div>

            <!-- Динамично поле за имена на гостове -->
            <div class="question" id="guests-container">
                <h3>Имена на придружители:</h3>
                <div id="guests-list"></div>
                <button type="button" onclick="addGuest()">+ Добави гост</button>
            </div>

            <!-- Въпрос 3 -->
            <div class="question">
                <h3>Кое меню предпочитате?</h3>
                <label>
                    <input type="radio" name="menu" value="standard" required>
                    Обикновено
                </label>
                <label>
                    <input type="radio" name="menu" value="vegetarian">
                    Вегетарианско
                </label>
            </div>

            <button type="submit" class="submit-btn">Изпрати</button>
        </form>
    </div>

    <script src="questionnaire.js"></script>
</body>
</html>
